services:
  nih-reporter-grant-similarity-engine:
    build: .
    container_name: nih-reporter-grant-similarity-engine
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a unique AUDIT_SECRET_KEY in your environment}
      - AUDIT_API_TOKEN=${AUDIT_API_TOKEN:?Set an AUDIT_API_TOKEN for log access}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
