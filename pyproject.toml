[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nih-reporter-grant-similarity-engine"
version = "2.0.0"
description = "GrantMatch-AI: NIH RePORT & RePADD Grant Scientific Similarity Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nih-reporter-grant-similarity-engine = "grant_match_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/nih-reporter-grant-similarity-engine"
Repository = "https://github.com/abusuraihsakhri/nih-reporter-grant-similarity-engine.git"
