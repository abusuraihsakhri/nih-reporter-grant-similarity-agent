name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"
          python -m pip check

      - name: Compile Python modules
        run: python -m compileall -q agents grant_match_ai cli.py enrichment.py simulator.py

      - name: Run unit and API tests
        run: python -m pytest -q

      - name: Check packaged command
        run: nih-reporter-grant-similarity-agent verify-audit

      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          assert match, "Expected self-contained browser application"
          Path("/tmp/grant-rule-console.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/grant-rule-console.js

      - name: Audit baseline verification
        run: |
          python - <<'PY'
          from agents.base import AuditLogger
          assert AuditLogger.verify_integrity()
          PY
